name: Refresh Website Content

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Fetch latest website content
        run: ./refresh-website-content.sh
      - name: Commit if changed
        run: |
          git config user.name "ponylang-main"
          git config user.email "main@ponylang.io"
          git add pony-ref/references/*-llms*.txt
          if git diff --cached --quiet; then
            echo "No changes to website content."
          else
            git commit -m "Update website content snapshots"
            git push
          fi
